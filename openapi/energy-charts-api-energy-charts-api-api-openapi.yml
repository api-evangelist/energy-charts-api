- name: Energy Charts API
paths:
  /v2:
    get:
      tags:
      - Energy Charts API
      summary: Machine-readable catalog of all v2 endpoints
      description: 'Self-describing directory of the v2 API.


        Lists every v2 endpoint with its parameters, accepted values and

        defaults, derived from the live OpenAPI schema. Intended as the single

        entry point for AI agents and other automated clients.'
      operationId: v2_catalog_v2_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponseV2'
components:
  schemas:
    ParameterDescriptorV2:
      properties:
        name:
          type: string
          title: Name
          description: Query parameter name.
        type:
          type: string
          title: Type
          description: JSON type of the parameter (string, integer, boolean).
        required:
          type: boolean
          title: Required
          description: Whether the parameter must be provided.
        default:
          anyOf:
          - type: string
          - type: 'null'
          title: Default
          description: Default value used when the parameter is omitted.
        allowed_values:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Allowed Values
          description: Closed list of accepted values, if the parameter is an enum.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Free-text explanation of the parameter.
      additionalProperties: false
      type: object
      required:
      - name
      - type
      - required
      title: ParameterDescriptorV2
      description: Describes one query parameter of a catalog entry.
    CatalogResponseV2:
      properties:
        schema_version:
          type: string
          title: Schema Version
          description: Version of the v2 response schema.
        title:
          type: string
          title: Title
          description: API title.
        description:
          type: string
          title: Description
          description: What this API provides and how to read responses.
        openapi_url:
          type: string
          title: Openapi Url
          description: Path of the full OpenAPI 3 schema.
        response_envelope:
          type: string
          title: Response Envelope
          description: Name of the uniform response model every data endpoint returns.
        endpoints:
          items:
            $ref: '#/components/schemas/CatalogEntryV2'
          type: array
          title: Endpoints
          description: All available v2 endpoints.
      additionalProperties: false
      type: object
