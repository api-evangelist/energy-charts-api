aid: energy-charts-api
name: Energy Charts API
description: >-
  The Energy-Charts API, provided by Fraunhofer ISE, delivers European energy data including electricity production by
  source, day-ahead spot market prices, cross-border electricity trading and physical flows, grid frequency, installed
  capacity, and renewable energy share forecasts. It covers more than 40 European countries and bidding zones, supports
  ISO 8601, daily, and UNIX timestamp formats, and is largely licensed under CC BY 4.0.
